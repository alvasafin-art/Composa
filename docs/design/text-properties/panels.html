<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composa · Панели</title>
<style>
:root{color-scheme:dark;--app:#212426;--panel:#2c3032;--field:#383d40;--line:#464b4d;--muted:#b1b8b8;--fg:#f0f3f1;--accent:#a6dbc9}*{box-sizing:border-box}body{margin:0;background:var(--app);color:var(--fg);font:14px/1.4 "Segoe UI",sans-serif}button,select,input{font:inherit;color:inherit}button,select{border:0;background:var(--field);padding:6px 10px;border-radius:5px}button{cursor:pointer}button:hover{background:#4a5152}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent)}[hidden]{display:none!important}header,.options,footer{display:flex;align-items:center;gap:14px;padding:0 16px;background:#282c2e}header{height:42px;border-bottom:1px solid var(--line)}header b{font-weight:650;font-size:17px}header span{color:var(--muted)}header button{margin-left:auto;font-size:12px}.options{height:44px;border-bottom:1px solid #3a3e40;gap:12px}.options strong{min-width:65px;font-weight:600}.options label{display:inline-flex;align-items:center;gap:8px}.options input[type=range]{width:80px}input{accent-color:var(--accent)}.options small{color:var(--muted)}
main{display:flex;height:calc(100dvh - 114px);min-height:470px;position:relative}.side{display:flex;flex-direction:column;overflow:auto;background:var(--panel);flex:none;width:clamp(155px,16vw,215px)}#right{width:clamp(210px,21vw,282px)}.side:empty{display:none}.panel{border-bottom:1px solid var(--line);padding-bottom:12px}.bar{display:flex;align-items:center;width:100%;text-align:left;gap:8px;height:43px;padding:0 14px;font-weight:600;cursor:grab;border-radius:0;background:transparent}.grip{letter-spacing:-2px;color:#a6adad;font-weight:900}.inner{padding:0 12px}.item{display:flex;align-items:center;text-align:left;gap:10px;width:100%;background:transparent;margin:2px 0}.item i{display:grid;place-items:center;border:1px solid #6b7372;border-radius:3px;width:23px;height:23px;font:15px Georgia;color:#e4e8e5}.item[aria-pressed=true]{background:#45554f}.inner label{display:block;font-size:12px;color:var(--muted);margin-top:10px}.inner select,.inner input[type=number]{margin-top:3px;width:100%;background:var(--field);border:0;padding:6px 9px;border-radius:5px}.inner input[type=color]{height:30px;width:100%;padding:2px;border:0;background:var(--field)}.inner h2{font-size:16px;margin:1px 0 12px;font-weight:600}#historyList{list-style:none;margin:0;padding:0 4px;color:var(--muted);font-size:13px}#historyList li{padding:6px 0}.rail{flex:none;align-self:center}.toolset{display:flex;flex-direction:column;align-items:center;gap:4px;background:#323739;padding:5px;border:1px solid #4c5253;border-radius:10px}.toolset button{background:transparent;font-size:13px}.toolset button.active{background:var(--accent);color:#142c23}.toolset .bar{width:auto;height:26px;padding:2px 6px}.bottom .toolset{flex-direction:row;border-radius:16px}.bottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%)}#center{min-width:0;flex:1;position:relative;display:grid;place-items:center;background:#1e2123;padding:14px 16px 63px}
#poster{width:min(100%,calc((100dvh - 215px)*.98),540px);aspect-ratio:.98;position:relative;container-type:inline-size;overflow:hidden;background:#e8e5d6;color:#263730}#poster svg,#paintCanvas{position:absolute;inset:0;width:100%;height:100%}#poster svg{pointer-events:none}#paintCanvas{touch-action:none}#poster .copy{position:absolute;left:7%;color:inherit;background:transparent;padding:0;line-height:1;border-radius:0;text-align:left;white-space:nowrap}#titleText{top:15%;font-family:Georgia;letter-spacing:-.06em}#subtitleText{top:40%;letter-spacing:-.015em}#poster .picked{outline:1.5px solid #13826c;outline-offset:4px}#poster .picked:after{content:'';position:absolute;right:-7px;bottom:-7px;width:5px;height:5px;background:white;border:1px solid #13826c}.folio{position:absolute;left:7%;right:7%;display:flex;justify-content:space-between;font-size:2cqw;letter-spacing:.1em;font-weight:650;pointer-events:none}.folio.top{top:6%}.folio.foot{bottom:5%;border-top:1px solid;padding-top:2%}#logPanel{min-height:108px}footer{height:28px;color:var(--muted);font-size:12px;justify-content:space-between}.historyTitle{color:var(--muted);font-size:12px}.zones{position:absolute;inset:0;z-index:5;display:flex;justify-content:space-between;pointer-events:none}.zone{display:grid;place-items:center;pointer-events:auto;background:#334941ee;border:1px dashed #93c9b6;color:#effbf6;width:100%;text-align:center;border-radius:7px}.zone.over{background:#547b6b;outline:2px solid var(--accent)}.dropSide{width:clamp(140px,17%,240px);display:flex;flex-direction:column;gap:5px;padding:5px}.dropSide .zone{flex:1}.bottomZone{position:absolute;bottom:6px;left:30%;width:40%;height:64px}.zones[hidden]{display:none}
@media(max-width:850px){#left{width:140px}#right{width:186px}.options{font-size:12px}.inner{padding:0 8px}.rail .toolset button{padding:5px}.options input[type=range]{width:55px}}
</style>
<header><b>Composa</b><span>Поле.cmps</span><button id="reset">Сбросить раскладку</button></header>
<div class="options"><strong id="toolName"></strong><label id="moveOptions"><input id="auto" type="checkbox" checked> Автовыбор слоя</label><label class="brushOpt" hidden>Диаметр <input id="radius" type="range" min="4" max="140" value="52"><output id="sizeValue">52 px</output></label><label class="brushOpt" hidden>Непрозрачность <input id="opacity" type="range" min="1" max="100" value="90"><output id="opacityValue">90 %</output></label></div>
<main><div id="left" class="side"></div><div id="railLeft" class="rail"></div><div id="center"><div id="poster">
<svg viewBox="0 0 500 510" preserveAspectRatio="none"><g id="bands" fill="none" stroke="#46654e" stroke-width="1.7"></g></svg><canvas id="paintCanvas" width="500" height="510"></canvas><div class="folio top"><span>АТЛАС ФОРМ</span><span>СЕРИЯ 04</span></div><button class="copy" id="titleText">Поле</button><button class="copy" id="subtitleText">Линии рельефа</button><div class="folio foot"><span>ГРАФИЧЕСКИЕ ЭТЮДЫ</span><span>ЛИСТ 04</span></div></div><div class="bottom" id="railBottom"></div></div><div class="rail" id="railRight"></div><div id="right" class="side"></div><div class="zones" id="zones" hidden></div></main>
<footer><span id="status" aria-live="polite"></span><span>Панели перемещаются за ⠿</span></footer>
<section class="panel" id="layers"><button draggable="true" class="bar"><span class="grip">⠿</span>Слои</button><div class="inner" id="rows"></div></section>
<section class="panel" id="props"><button draggable="true" class="bar"><span class="grip">⠿</span>Свойства</button><div class="inner"><h2 id="objectName"></h2><div id="typeFields"><label>Шрифт<select id="font"><option>Georgia</option><option>Arial</option><option>Trebuchet MS</option><option>Segoe UI</option></select></label><label>Кегль, px<input type="number" id="fontSize" min="12" max="140"></label></div><label>Цвет<input type="color" id="color"></label></div></section>
<section class="panel" id="logPanel"><button draggable="true" class="bar"><span class="grip">⠿</span>История</button><ol class="inner" id="historyList"><li>Открытие документа</li></ol></section>
<div id="tools" class="toolset"><button class="bar" draggable="true" aria-label="Переместить инструменты"><span class="grip">⠿</span></button><button id="move">↖ Move</button><button id="brush">Кисть</button></div>
<script>
const $=id=>document.getElementById(id), nodes=['layers','props','logPanel'], names={titleText:'Поле',subtitleText:'Линии рельефа',art:'Рельеф'};
const values={titleText:{font:'Georgia',size:104,color:'#263730'},subtitleText:{font:'Segoe UI',size:20,color:'#263730'},art:{color:'#46654e'}};
let current='titleText',tool='move',drag=null,stroke=null,position=null;
function log(s){const li=document.createElement('li');li.textContent=s;$('historyList').prepend(li);if($('historyList').children.length>7)$('historyList').lastChild.remove()}
for(let i=0;i<76;i++){let path=document.createElementNS('http://www.w3.org/2000/svg','path'),pts=[];for(let j=0;j<=200;j++){let a=Math.PI*2*j/200,rad=(61+i*.86)*(1+.20*Math.sin(3*a+i*.009)+.085*Math.cos(5*a));pts.push((j?'L':'M')+(320+rad*1.3*Math.cos(a)+i*.82)+' '+(326+rad*.74*Math.sin(a)-i*.15))}path.setAttribute('d',pts.join(' ')+'Z');$('bands').append(path)}
function sync(){for(const id of ['titleText','subtitleText']){const e=$(id),v=values[id];e.style.fontFamily=v.font;e.style.fontSize=v.size/5+'cqw';e.style.color=v.color;e.classList.toggle('picked',current===id);e.style.pointerEvents=tool==='move'?'auto':'none'}$('bands').setAttribute('stroke',values.art.color);
for(const b of $('rows').children)b.setAttribute('aria-pressed',String(b.dataset.id===current));$('typeFields').hidden=current==='art';$('objectName').textContent=names[current];$('color').value=values[current].color;if(current!=='art'){$('font').value=values[current].font;$('fontSize').value=values[current].size}
$('toolName').textContent=tool==='move'?'Move':'Кисть';$('moveOptions').hidden=tool!=='move';document.querySelectorAll('.brushOpt').forEach(x=>x.hidden=tool!=='brush');for(const id of ['move','brush'])$(id).classList.toggle('active',tool===id);$('status').textContent=tool==='brush'&&current!=='art'?'Выбран текстовый слой «'+names[current]+'». Для мазка выберите растровый слой «Рельеф».':'Активный слой · '+names[current];}
for(const [id,name] of Object.entries(names)){const b=document.createElement('button');b.className='item';b.dataset.id=id;b.innerHTML='<i>'+(id==='art'?'◉':'Т')+'</i>'+name;b.onclick=()=>{current=id;sync()};$('rows').append(b)}
for(const id of ['move','brush'])$(id).onclick=()=>{tool=id;sync()};
for(const id of ['titleText','subtitleText'])$(id).onpointerdown=e=>{if(tool!=='move')return;if($('auto').checked)current=id;sync();if(current==='art')return;const r=$(current).getBoundingClientRect(),p=$('poster').getBoundingClientRect();position={id:current,x:e.clientX,y:e.clientY,left:r.left-p.left,top:r.top-p.top,p};$(id).setPointerCapture(e.pointerId)};
document.addEventListener('pointermove',e=>{if(position){const v=position;$(v.id).style.left=(v.left+e.clientX-v.x)/v.p.width*100+'%';$(v.id).style.top=(v.top+e.clientY-v.y)/v.p.height*100+'%'}});
document.addEventListener('pointerup',e=>{if(position&&Math.hypot(e.clientX-position.x,e.clientY-position.y)>2)log('Перемещение · '+names[position.id]);position=null});document.addEventListener('pointercancel',()=>position=null);
$('font').onchange=e=>{values[current].font=e.target.value;sync();log('Шрифт · '+names[current])};$('fontSize').onchange=e=>{values[current].size=Math.max(12,Math.min(140,Number(e.target.value)||20));sync();log('Кегль · '+names[current])};$('color').oninput=e=>{values[current].color=e.target.value;sync()};$('color').onchange=()=>log('Цвет · '+names[current]);
$('radius').oninput=e=>$('sizeValue').textContent=e.target.value+' px';$('opacity').oninput=e=>$('opacityValue').textContent=e.target.value+' %';
function point(e){let r=$('paintCanvas').getBoundingClientRect();return [(e.clientX-r.left)*500/r.width,(e.clientY-r.top)*510/r.height]}
const ctx=$('paintCanvas').getContext('2d');$('paintCanvas').onpointerdown=e=>{if(tool==='move'){if($('auto').checked){current='art';sync()}return}if(current!=='art')return;stroke=point(e);e.target.setPointerCapture(e.pointerId);ctx.strokeStyle=values.art.color;ctx.lineWidth=Number($('radius').value);ctx.lineCap='round';ctx.globalAlpha=Number($('opacity').value)/100;ctx.beginPath();ctx.moveTo(...stroke);ctx.lineTo(stroke[0]+.01,stroke[1]);ctx.stroke()};
$('paintCanvas').onpointermove=e=>{if(!stroke)return;const p=point(e);ctx.beginPath();ctx.moveTo(...stroke);ctx.lineTo(...p);ctx.stroke();stroke=p};$('paintCanvas').onpointerup=()=>{if(stroke)log('Мазок · Рельеф');stroke=null};$('paintCanvas').onpointercancel=()=>stroke=null;
const defaults={left:['layers'],right:['props','logPanel'],tools:'railBottom'},key='composa.panels.prototype.v1';
function install(v){if(!v||!Array.isArray(v.left)||!Array.isArray(v.right)||[...v.left,...v.right].sort().join()!==[...nodes].sort().join()||!['railLeft','railRight','railBottom'].includes(v.tools))v=defaults;for(const side of ['left','right'])for(const id of v[side])$(side).append($(id));$(v.tools).append($('tools'))}
function save(){const ids=side=>[...$(side).children].map(e=>e.id);try{localStorage.setItem(key,JSON.stringify({left:ids('left'),right:ids('right'),tools:$('tools').parentNode.id}))}catch{}}
try{install(JSON.parse(localStorage.getItem(key)))}catch{install(defaults)}$('reset').onclick=()=>{install(defaults);save()};
function stop(){drag=null;$('zones').hidden=true;$('zones').replaceChildren()}
function zone(host,label,action,extra=''){const z=document.createElement('div');z.className='zone '+extra;z.textContent=label;z.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();if(drag){action();save()}stop()};host.append(z)}
function targets(){const zones=$('zones');zones.replaceChildren();for(const [side,word] of [['left','Слева'],['right','Справа']]){let col=document.createElement('div');col.className='dropSide';zones.append(col);if(drag==='tools'){zone(col,word,()=>$(side==='left'?'railLeft':'railRight').append($('tools')));continue}
const peers=[...$(side).children].filter(e=>e.id!==drag);if(!peers.length){zone(col,word,()=>$(side).append($(drag)));continue}for(const peer of peers){zone(col,'Над «'+peer.querySelector('.bar').textContent.slice(1).trim()+'»',()=>$(side).insertBefore($(drag),peer))}zone(col,word+' внизу',()=>$(side).append($(drag)))}
if(drag==='tools')zone(zones,'Снизу',()=>$('railBottom').append($('tools')),'bottomZone');zones.hidden=false}
for(const b of document.querySelectorAll('[draggable]')){b.ondragstart=e=>{drag=b.parentElement.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag);requestAnimationFrame(()=>{if(drag)targets()})};b.ondragend=stop}
sync();
</script></html>
